name: FRA-11 current-main typed OpenRouter 429 regression

on:
  pull_request:
    branches:
      - fra11/validation-base-current-main-20261112
    paths:
      - agent/error_classifier.py
      - agent/auxiliary_call_outcome.py
      - agent/auxiliary_error_policy.py
      - agent/auxiliary_client.py
      - tests/agent/test_error_classifier.py
      - tests/agent/test_auxiliary_error_policy.py

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fra11-current-main-openrouter-typed-429-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused-regression:
    name: Ruff + canonical FRA-11 classifier / auxiliary tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GROQ_API_KEY: ""
      CEREBRAS_API_KEY: ""
      TOGETHER_API_KEY: ""
      XAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      FIREWORKS_API_KEY: ""
      BAI_API_KEY: ""
      HERMES_TEST_WORKERS: "2"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate ancestry and bounded file scope
        shell: bash
        env:
          EXPECTED_UPSTREAM_BASE: 6a0d2d12815c0546b0bcaf05046e2fe3293f60aa
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_UPSTREAM_BASE" HEAD
          echo "FRA11_CANDIDATE_SHA=$actual"
          echo "UPSTREAM_BASE_SHA=$EXPECTED_UPSTREAM_BASE"
          changed_files="$(git diff --name-only "$EXPECTED_UPSTREAM_BASE"...HEAD)"
          printf '%s\n' "$changed_files"
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue
            case "$changed_file" in
              agent/error_classifier.py|agent/auxiliary_call_outcome.py|agent/auxiliary_error_policy.py|agent/auxiliary_client.py|tests/agent/test_error_classifier.py|tests/agent/test_auxiliary_error_policy.py) ;;
              *) echo "UNEXPECTED_CANDIDATE_FILE_SCOPE: $changed_file"; exit 1 ;;
            esac
          done <<< "$changed_files"

      - name: Set up pinned test environment
        id: setup-test-env
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: "true"
          prune-python-cache: "true"
          save-tools-cache: "false"
          save-python-cache: "false"
          cache-node: "false"

      - name: Install pinned Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Ruff on candidate files
        shell: bash
        run: |
          set -euo pipefail
          ruff check agent/error_classifier.py agent/auxiliary_call_outcome.py agent/auxiliary_client.py tests/agent/test_error_classifier.py tests/agent/test_auxiliary_error_policy.py

      - name: Canonical focused regression tests
        env:
          HERMES_PYTHON: ${{ steps.setup-test-env.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh tests/agent/test_error_classifier.py tests/agent/test_auxiliary_error_policy.py -j 2
