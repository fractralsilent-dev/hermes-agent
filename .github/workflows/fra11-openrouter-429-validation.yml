name: FRA-11 OpenRouter 429 regression

# This narrowly scoped check uses GitHub-hosted runners on the owner fork.
# The upstream CI jobs use Blacksmith labels that are not available to this fork.
# No secrets or provider credentials are passed to the job.

on:
  pull_request:
    paths:
      - "agent/auxiliary_client.py"
      - "agent/error_classifier.py"
      - "agent/credential_pool.py"
      - "agent/custom_entry_pool.py"
      - "tests/agent/test_auxiliary_client.py"
      - "tests/agent/test_auxiliary_auth_rung_fallthrough.py"
      - "tests/agent/test_auxiliary_transient_retry.py"
      - "tests/agent/test_auxiliary_error_classification.py"
      - "tests/agent/test_credential_pool.py"
      - "tests/agent/test_credential_pool_key_rotation.py"
      - "tests/agent/test_credential_pool_sole_rotate_recovery.py"
      - "tests/agent/test_error_classifier.py"
      - "tests/agent/test_error_classifier_upstream_blocked.py"
      - "pyproject.toml"
      - "uv.lock"
      - "pm/**"
      - "scripts/ci/setup_toolchain.py"
      - "scripts/ci/python_packages.py"
      - "scripts/code_health.py"
      - ".github/actions/setup-pm/**"
      - ".github/workflows/fra11-openrouter-429-validation.yml"

permissions:
  contents: read

concurrency:
  group: fra11-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-regression:
    name: FRA-11 targeted regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pinned test environment
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: "true"
          prune-python-cache: "true"
          save-tools-cache: "false"
          save-python-cache: "false"
          cache-node: "false"

      - name: Install pinned lint tools
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Ruff changed files
        shell: bash
        run: |
          set -euo pipefail
          ruff check agent/auxiliary_client.py tests/agent/test_auxiliary_error_classification.py

      - name: Run related regression files in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/agent/test_auxiliary_client.py \
            tests/agent/test_auxiliary_auth_rung_fallthrough.py \
            tests/agent/test_auxiliary_transient_retry.py \
            tests/agent/test_auxiliary_error_classification.py \
            tests/agent/test_credential_pool.py \
            tests/agent/test_credential_pool_key_rotation.py \
            tests/agent/test_credential_pool_sole_rotate_recovery.py \
            tests/agent/test_error_classifier.py \
            tests/agent/test_error_classifier_upstream_blocked.py
          do
            echo "::group::${test_file}"
            "$HERMES_PYTHON" -m pytest -q --tb=short "$test_file"
            echo "::endgroup::"
          done
