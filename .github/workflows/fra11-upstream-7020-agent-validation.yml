name: FRA-11 upstream 7020 OpenRouter 429 guard validation

on:
  push:
    branches:
      - fra11/openrouter-429-guard-upstream-7020-20261031
    paths:
      - .github/workflows/fra11-upstream-7020-agent-validation.yml
      - agent/auxiliary_client.py
      - tests/agent/test_auxiliary_client.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fra11-upstream-7020-agent-validation
  cancel-in-progress: false

jobs:
  agent-suite:
    name: Ruff + canonical tests/agent (upstream 7020 candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GROQ_API_KEY: ""
      CEREBRAS_API_KEY: ""
      TOGETHER_API_KEY: ""
      XAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      FIREWORKS_API_KEY: ""
      BAI_API_KEY: ""
      HERMES_TEST_WORKERS: "4"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate, upstream ancestry, and bounded source scope
        shell: bash
        env:
          EXPECTED_UPSTREAM_BASE: 7020ea3e96c3fdbc768c5296493e186df46f075b
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_UPSTREAM_BASE" HEAD
          printf 'FRA11_CANDIDATE_SHA=%s\\n' "$actual"
          printf 'UPSTREAM_BASE_SHA=%s\\n' "$EXPECTED_UPSTREAM_BASE"
          changed_files="$(git diff --name-only "$EXPECTED_UPSTREAM_BASE"...HEAD)"
          printf '%s\\n' "$changed_files"
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue
            case "$changed_file" in
              agent/auxiliary_client.py|tests/agent/test_auxiliary_client.py|.github/workflows/fra11-upstream-7020-agent-validation.yml) ;;
              *) echo "UNEXPECTED_CANDIDATE_FILE_SCOPE: $changed_file"; exit 1 ;;
            esac
          done <<< "$changed_files"

      - name: Set up pinned test environment
        id: setup-test-env
        uses: ./.github/actions/setup-pm
        with:
          extras: '[ "all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain" ]'
          test-environment: "true"
          prune-python-cache: "true"
          save-tools-cache: "false"
          save-python-cache: "false"
          cache-node: "false"

      - name: Install pinned Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Run blocking Ruff check
        shell: bash
        run: |
          set -euo pipefail
          ruff check .

      - name: Run canonical full tests/agent suite
        env:
          HERMES_PYTHON: ${{ steps.setup-test-env.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh tests/agent/ -j 4
